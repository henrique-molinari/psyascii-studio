<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PsyASCII Studio</title>
</head>
<body class="crt">
  <a class="skip" href="#cv">Pular para o canvas</a>
  <div id="app">
    <header class="bar">
      <h1>PsyASCII Studio</h1>
      <div class="tools" role="toolbar" aria-label="Controles gerais">
        <span id="fps" class="fps" hidden aria-hidden="true"></span>
        <button class="btn" id="b-pause" type="button" aria-pressed="false">PAUSAR</button>
        <button class="btn drawer-btn" id="b-drawer" type="button" aria-expanded="false" aria-controls="side">PAINEL</button>
      </div>
    </header>
    <main>
      <section class="frame" id="frame" aria-label="Canvas ASCII">
        <div class="title">
          <span id="title">[ canvas ] aguardando imagem</span>
          <span class="zoom" role="group" aria-label="Zoom">
            <button class="btn" id="b-zout" type="button" aria-label="Diminuir zoom">−</button>
            <button class="btn" id="b-zfit" type="button" aria-label="Ajustar à moldura">AJUSTAR</button>
            <button class="btn" id="b-zin" type="button" aria-label="Aumentar zoom">+</button>
          </span>
        </div>
        <div class="vp" id="vp">
          <canvas id="cv" tabindex="0" aria-label="Imagem convertida em caracteres"></canvas>
          <p id="empty" class="empty" hidden>&gt; aguardando imagem... arraste, cole ou use [ ABRIR ]</p>
        </div>
      </section>
      <aside id="side" class="side" aria-label="Painel de controles"></aside>
      <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
